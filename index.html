<!doctype html>
<html lang="de" data-bs-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#08090e"><meta name="robots" content="noindex,nofollow">
<title>Eine kleine Frage</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<link rel="stylesheet" href="style.css"><script src="app.js" defer></script>
</head>
<body>
<canvas id="gravity" aria-hidden="true"></canvas><div class="halo" aria-hidden="true"></div><div class="grain" aria-hidden="true"></div>
<main class="container d-flex align-items-center justify-content-center">
<section id="gate" class="gate text-center" aria-labelledby="gate-title">
<form id="code-form" novalidate>
<h1 id="gate-title">Zugangscode</h1>
<div class="input-shell"><input id="code" class="form-control" type="password" autocomplete="off" inputmode="numeric" enterkeyhint="go" aria-labelledby="gate-title" aria-describedby="error" maxlength="30" autofocus><button type="submit" class="enter-button" aria-label="Zugangscode absenden">↵</button></div>
<p id="error" role="status" class="error"></p>
</form>
</section>
<section id="question" class="question text-center" hidden aria-labelledby="question-title">
<h1 id="question-title" tabindex="-1">Schickst du mir<br><em>Fußbilder?</em></h1>
<div class="answer-zone" id="answer-zone"><button id="yes" class="btn yes">Ja <span>↗</span></button><button id="no" class="btn no">Nein</button></div>
</section>
<section id="result" class="result text-center" hidden aria-labelledby="result-title">
<div class="result-icon" id="result-icon" aria-hidden="true">♡</div>

<h1 id="result-title" tabindex="-1">Yaaay!</h1><p id="result-text" class="subtitle"></p>
<button id="restart" class="btn restart">Zurück zum Anfang <span>↗</span></button>
</section>
</main>
<noscript><p class="noscript">Bitte aktiviere JavaScript, um den Zugangscode einzugeben.</p></noscript>
<div id="confetti" aria-hidden="true"></div>
</body></html>
